<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nivra Size Finder</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- الخلفية -->
<div class="bg"></div>

<!-- الفقاعات -->
<div class="bubbles">
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<div class="container">

<div class="card">

<div class="brand">
<h1>Nivra</h1>
<p>مساعد ذكي لاختيار القياس المناسب</p>
</div>

<div class="grid">

<input
id="height"
type="number"
placeholder="الطول (سم) *">

<input
id="weight"
type="number"
placeholder="الوزن (كغم) *">

<input
id="chest"
type="number"
placeholder="محيط الصدر (اختياري)">

<input
id="waist"
type="number"
placeholder="محيط الخصر (اختياري)">

</div>

<button class="main-btn" onclick="calculateSize()">
<i class="fa-solid fa-ruler-combined"></i>
اكتشف القياس المناسب
</button>

<!-- النتيجة -->
<div id="result" class="result hidden"></div>

<!-- مشاركة النتيجة -->
<button
id="openShareModal"
class="share-result-btn hidden">

<i class="fa-solid fa-share-nodes"></i>
 مشاركة المقاس مع نيفرا

</button>

<div id="shareModal" class="modal">

<div class="modal-content">

<span class="close-modal">&times;</span>

<h3>
<i class="fa-solid fa-paper-plane"></i>
مشاركة النتيجة
</h3>

<div class="modal-buttons">

<a href="#" id="copySizeResult" class="modal-btn copy-btn" onclick="copySizeResult()">
    <i class="fas fa-copy"></i>
    نسخ القياس الخاص بي
</a>
  
<a id="shareWhatsapp" target="_blank" class="modal-btn whatsapp">
<i class="fab fa-whatsapp"></i>
ارسال مباشر عبر واتساب
</a>

<a id="shareInstagram" target="_blank" class="modal-btn instagram">
<i class="fab fa-instagram"></i>
انستغرام
</a>

<a id="shareTiktok" target="_blank" class="modal-btn tiktok">
<i class="fab fa-tiktok"></i>
تيك توك
</a>

</div>

</div>

</div>

<!-- روابط البراند -->

<div class="socials">

<a
href="https://www.instagram.com/nivra.iq?igsh=bWE3dTJwajV5bnB5&utm_source=qr"
target="_blank"
class="social-btn instagram">

<i class="fab fa-instagram"></i>
 تواصل معنا عبر Instagram

</a>

<a
href="https://wa.me/message/VZ75ZZBY6H47O1"
target="_blank"
class="social-btn whatsapp">

<i class="fab fa-whatsapp"></i>
 تواصل معنا عبر WhatsApp

</a>

<a
href="https://www.tiktok.com/@nivra.iq?_r=1&_t=ZS-973Wr9i5ZWH"
target="_blank"
class="social-btn tiktok">

<i class="fab fa-tiktok"></i>
تواصل معنا عبر Tik Tok
</a>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
